name: Keep Streamlit App Awake

on:
  schedule:
    # Runs automatically every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Playwright
        uses: microsoft/playwright-github-action@v1

      - name: Visit Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto('https://ffc-price-offer-generator.streamlit.app/', timeout=60000)
              page.wait_for_timeout(15000)
              browser.close()
          "
